name: Merge Checks
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  merge-checks:
    if: github.ref != 'refs/heads/main'
    uses: stand-sure-org/Oui-DELIVER/.github/workflows/merge-checks.yml@main
    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}
    with:
      allowed_licenses_path: './.github/actions/check-licenses-action/allowed-licenses.json'
      ignored_packages_path: './.github/actions/check-licenses-action/ignored-packages.json'
