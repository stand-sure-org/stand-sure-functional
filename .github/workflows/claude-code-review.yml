name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read
  # gh pr checks reads check runs, which needs checks: read.
  checks: read

jobs:
  review:
    # PRs open as drafts (Oui-DELIVER auto-pr); the review waits for ready_for_review, after the description is filled in.
    # For an ad hoc review of a draft, comment @claude (claude.yml).
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ANTHROPIC_API_KEY is not set for this repo, so the Claude review is skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Review
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          allowed_bots: "stand-sure-auto-pr[bot],stand-sure-ai[bot],claude[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against CLAUDE.md and the design docs in
            .specify/features/functional-core/. Focus on:
            1. Correctness and the library's contracts: no library API throws for an
               expected failure, failure comes first in every two-branch signature,
               Try never catches OperationCanceledException or OutOfMemoryException.
            2. Public API changes: PublicAPI.Shipped/Unshipped.txt and the approval
               snapshot must match.
            3. Allocation and AOT safety in src/.
            4. Tests: xUnit v3 + AwesomeAssertions, real coverage of edge cases.

            Do not build or test. The build-publish and merge-checks workflows build in Release with
            warnings as errors and run the tests on this PR. Read their state with `gh pr checks` and
            report it in the summary; if they are still running, say so rather than waiting.

            Do not comment on the PR description; the author writes it after the PR opens.

            Use inline comments for specific issues and one top-level comment for the summary.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*)"
